apiVersion: v1
kind: Service
metadata:
  name: cnpg-i-pganalyze
  labels:
    app: cnpg-i-pganalyze
    cnpg.io/pluginName: cnpg-i-pganalyze.pganalyze.com
  annotations:
    cnpg.io/pluginClientSecret: cnpg-i-pganalyze-client-tls
    cnpg.io/pluginServerSecret: cnpg-i-pganalyze-server-tls
    cnpg.io/pluginPort: "9090"
spec:
  ports:
  - name: grpc
    port: 9090
    protocol: TCP
    targetPort: 9090
  selector:
    app: cnpg-i-pganalyze
