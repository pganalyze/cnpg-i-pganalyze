apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cnpg-i-pganalyze-client
spec:
  secretName: cnpg-i-pganalyze-client-tls
  commonName: "cnpg-i-pganalyze-client"
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  isCA: false
  usages:
    - client auth
  issuerRef:
    name: cnpg-i-pganalyze-selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
